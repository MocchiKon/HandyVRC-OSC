# Connection mode: API (via internet) or BLUETOOTH (direct BLE connection). Defaults to API if missing.
connectionMode=BLUETOOTH

# Processing algorithm: HSP (default), HDSP or HDSP_SMOOTHED.
# HSP buffers timestamped points on the device and works with both API and BLUETOOTH connection modes.
# HDSP (Handy Direct Streaming Protocol) streams the newest position directly and works with BLUETOOTH only.
# HDSP_SMOOTHED uses HDSP as well, but instead of forwarding every point 1:1 it measures how fast and in which
# direction you move and moves the slider towards the top/bottom of the stroke at that speed. The speed is only
# corrected when it changes significantly, the slider is stopped at the position you stopped at, and it never
# runs past the movement you actually made. Works with BLUETOOTH only as well.
processingAlgorithm=HSP

# (OPTIONAL, HDSP only) If true, the app measures the message delay and its jitter and schedules each HDSP
# command so that it reaches the device when the previous move finishes, which avoids interrupting a move that
# is still running (smoother movement). If false, commands are sent as soon as the send interval allows.
# Not used by HDSP_SMOOTHED (it chains its own moves by extrapolating your movement instead).
hdspTiming=false

# (OPTIONAL, HDSP_SMOOTHED only) How much the measured input speed has to change (in %) before the move of the
# slider is corrected. A higher value sends fewer commands (smoother movement, but speed changes are followed
# with more delay), a lower value follows your speed more closely.
hdspSpeedChangeThresholdPercent=25

# (OPTIONAL, HDSP_SMOOTHED only) Input speed below this percentage of the fastest speed of the current movement
# counts as "the user stopped", which stops the slider at the position the input stopped at. This is also the
# slowest movement the algorithm follows: movements slower than 4%/s are treated as a stop.
hdspSpeedStopThresholdPercent=15

# (OPTIONAL, HDSP_SMOOTHED only) How far the slider may be behind the input (in % of the stroke) before it is
# brought back even though the speed did not change enough to cross hdspSpeedChangeThresholdPercent.
hdspDivergenceThresholdPercent=20

# (OPTIONAL, HDSP_SMOOTHED only) Time span (in ms) of the received values that is used to measure the input
# speed. A shorter window follows speed changes faster but is more sensitive to the quantization of the avatar
# parameter, a longer window is steadier but lags behind the movement. 150 is a good default for strokes up to
# about one stroke per second; for faster strokes a lower value (for example 100) follows them more closely.
hdspSpeedMeasureWindowMs=150

# Connection key of your Handy device (required for API mode only)
deviceConnectionKey=

# SPS type (PENETRATOR or ORIFICE). This changes how penetration amount is calculated.
# Set to PENETRATOR if you are using penetrator on your avatar
# Set to ORIFICE if you are using orifice on your avatar (Useful when remote user runs this app to control your Handy)
spsType=PENETRATOR

# Avatar parameter that will be used to move your device, if blank applies default value depending on spsType:
# ORIFICE - "/avatar/parameters/OGB/Orf/*/PenOthersNewRoot"
# PENETRATOR - "/avatar/parameters/OGB/Pen/*/PenOthers"
# If you want to test it on yourself then replace 'Others' with 'Self' (for example: PenSelfNewRoot or PenSelf)
avatarParameter=

# (OPTIONAL, ORIFICE only) Avatar parameter carrying the proximity of the penetrator tip, used to auto-detect
# the penetrator length. If blank it is derived from 'avatarParameter' by replacing its 'NewRoot' suffix with 'NewTip'.
penetratorTipParameter=

# (OPTIONAL) Applies specified delay (in ms) to all points sent to Handy. Change it to improve synchronization.
# If left blank, it is auto-calculated on startup as: sendMessageEveryMs + measured delay to the device.
# You can use this formula as a starting point: 200ms + VRChat latency (If using Virtual Desktop add its latency)
# Should not be lower than sendMessageEveryMs + Handy device latency otherwise it can cause points skipping
pointsOffset=

# Amount of milliseconds that app should wait before sending another request to Handy servers (It will only send one when there is new data to be sent).
# When using API connection mode DO NOT set this lower than necessary to avoid spamming Handy servers with requests.
# If set too low then data can arrive at Handy servers in wrong order which will lead to skipping points (more jumpy movement)
# (Newest points will arrive after sendMessageEveryMs + TheHandy delay, which has to be lower than pointsOffset to avoid skipping)
sendMessageEveryMs=0

# Application ID used for authentication (it's recommended to create your own via https://user.handyfeeling.com/ in case this one gets throttled/banned)
handyApplicationId=oscT9zwCSnAKDYMthQ4yY_5m8jMUYY-W

# (OPTIONAL) If value is specified, it will change minimum slider position. A value between 0.0 and 1.0.
sliderMin=

# (OPTIONAL) If value is specified, it will change maximum slider position. A value between 0.0 and 1.0.
sliderMax=

# (OPTIONAL) Penetration value (in %, so between 0 and 100) that counts as fully penetrated. It does not limit the
# slider movement (that is what sliderMin and sliderMax do), it only maps the received/calculated penetration value:
# with 50 a penetration of 50% moves the slider as far as 100% normally would, 10% becomes 20%, and 80% or more
# stays at 100%. Used by every processingAlgorithm and for both spsType values. Blank disables the mapping.
fullyPenetratedAtValue=85

# OSC port for receiving messages (only used when useOscQuery=false, otherwise the app picks a free port itself)
listenOnPort=9001

# If true (default), the app uses OSCQuery (https://github.com/Vidvox/OSCQueryProposal) to tell VRChat where to
# send OSC messages. The app announces itself over mDNS and receives OSC on a free port it picks on startup, so
# it keeps working even when another application already listens on 'listenOnPort' (port collision).
# Requires OSC enabled in VRChat and a VRChat version with OSCQuery support (2023.3.1 or newer).
# If false, the app only listens on 'listenOnPort' (the old behavior without OSCQuery); in that case another
# application using that port prevents this app from receiving any OSC messages.
useOscQuery=true

# Minimal position value change to consider by algorithm (in percentage)
minimalValueChange=3

# If true, the app checks at startup whether a newer version was released on GitHub
# (https://github.com/MocchiKon/HandyVRC-OSC/releases) and notifies you when there is one.
# The check runs in the background and is best effort: no internet connection, GitHub being unavailable or the
# repository being gone never blocks or breaks the app, it only means that no update information is shown.
# Set to false to disable this feature completely.
checkForUpdates=true

# Test mode: if true, generates fake sawtooth wave data instead of listening for OSC messages. Useful for testing without VRChat.
testMode=false

# If true, points will be saved to a csv file. Useful for debugging and testing. File will be saved in the same folder as the app with name "handy_points.csv".
savePointsToFile=false

# Experimental.
clamp=false
pauseOnStarving=false